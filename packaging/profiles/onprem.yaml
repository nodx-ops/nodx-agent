# On-prem profile → local stack (ingestion edge on the LAN/compose net).
# Copy to /etc/nodx/agent.yaml and fill the five human-claimed values.
server: "http://<on-prem-stack-host>:8080" # e.g. http://ingest:8080 on the compose net
agent_secret: "REPLACE-ME"                 # must match the stack's NODX_AGENT_SECRET
agent_id: "REPLACE-ME"                     # AGENT_ID: agents.id UUID from pairing (never auto-generated)
agent_auth_token: "REPLACE-ME"             # AGENT_AUTH_TOKEN: pairing claim token
datacenter_id: "REPLACE-ME"                # DATACENTER_ID: site label (e.g. dc-frankfurt-1)
poll_interval: 15s
heartbeat_interval: 60s
request_timeout: 10s
redfish_enabled: false # STUB: on-agent Redfish is deferred (R26); must stay false
# state_path: /var/lib/nodx-agent/state.json
# spool_dir: /var/lib/nodx-agent/spool
# obs_addr: "127.0.0.1:6060"
