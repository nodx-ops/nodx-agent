# CI for the PUBLIC nodx-agent repository.
#
# Deliberately simpler than any monorepo pipeline this code came from: the
# public repo is a standalone Go module at the repo root, so no
# working-directory indirection is needed. One job proves it builds and
# tests on a clean runner; a second cuts release artifacts.
#
# stdlib-only: no dependency cache is required to build, though caching the
# module cache keeps runs quick if a dependency ever appears.
name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: gofmt / vet / build / test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true

      - name: gofmt (must be clean)
        run: |
          OUT=$(gofmt -l .)
          if [ -n "$OUT" ]; then
            echo "Unformatted files:"
            echo "$OUT"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go build
        run: go build ./...

      - name: go test
        run: go test ./...

      - name: module must stay stdlib-only
        run: |
          # CONTRIBUTING promises zero external dependencies. A require block
          # appearing is a policy change, not a silent regression — it needs a
          # human decision, so fail loudly here.
          if grep -E '^\s+require\s*\(' go.mod >/dev/null 2>&1; then
            echo "::error::go.mod gained a require block — this project is stdlib-only by policy (see CONTRIBUTING.md)"
            grep -A5 'require (' go.mod || true
            exit 1
          fi
          if grep -E '^\s+[a-z0-9.-]+\.[a-z]+/' go.mod >/dev/null 2>&1; then
            echo "::error::go.mod references an external module path"
            exit 1
          fi
          echo "stdlib-only: ok"

      - name: dry-run smoke test
        # Proves the documented first-run experience actually works on a
        # clean machine: no server, no config, real telemetry out.
        run: |
          go build -o /tmp/nodx-agent ./cmd/nodx-agent
          timeout 20 /tmp/nodx-agent --stdout > /tmp/out.jsonl 2>/tmp/err.log || true
          echo "--- stderr ---"; cat /tmp/err.log
          echo "--- envelopes ---"; cat /tmp/out.jsonl
          LINES=$(wc -l < /tmp/out.jsonl)
          if [ "$LINES" -lt 1 ]; then
            echo "::error::--stdout produced no envelopes; first-run experience is broken"
            exit 1
          fi
          # each line must be valid JSON carrying the contract fields
          if command -v jq >/dev/null 2>&1; then
            jq -e 'select(.metric and .value and .device_id and .agent_id and .timestamp)' /tmp/out.jsonl >/dev/null || {
              echo "::error::envelope missing contract fields"; exit 1; }
          fi
          echo "ok: $LINES envelope(s)"

  # Release artifacts (.deb/.rpm/tarball) on version tags only.
  release:
    name: release
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true

      - name: package tools
        run: sudo apt-get update && sudo apt-get install -y rpm

      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
